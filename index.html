<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e0b14" />
    <script>
      let savedTheme;
      try { savedTheme = localStorage.getItem('portfolio-theme'); } catch { /* Storage may be unavailable. */ }
      const theme = savedTheme === 'light' || savedTheme === 'dark'
        ? savedTheme
        : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#f8f5fc' : '#0e0b14';
    </script>
    <meta name="description" content="Pedro Henrique — desenvolvimento de sites e soluções digitais para negócios locais. Conheça meus projetos e minha trajetória." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Pedro Henrique — Desenvolvedor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
